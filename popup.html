<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <label for="keyword">Keyword:</label>
        <input type="text" id="keyword" placeholder="Enter a keyword">

        <label for="length">Character Length: <span id="lengthValue">12</span></label>
        <input type="range" id="length" min="6" max="20" value="12">

        <div class="options">
            <label><input type="checkbox" id="uppercase" checked> Uppercase Letters</label>
            <label><input type="checkbox" id="lowercase" checked> Lowercase Letters</label>
            <label><input type="checkbox" id="numbers" checked> Numbers</label>
            <label><input type="checkbox" id="symbols" checked> Special Characters</label>
        </div>

        <button id="generate">Generate</button>

        <div class="password-container">
            <input type="text" id="password" readonly>
            <button id="copy">Copy</button>
        </div>

        <div class="strength" id="strength">Strength: Medium</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
